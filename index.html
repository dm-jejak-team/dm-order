    // 구글 Apps Script 웹앱(백엔드) 호출. 권한 검사는 모두 서버(Apps Script)에서 다시 합니다.
    const API_URL = 'https://script.google.com/macros/s/AKfycby25keEjsRK3opIDdwY_M03LSDJv7xQu5TFi_vSSHCiWszzKytfPiIP6h7Hr6_pO0KgWg/exec';
    let sessionToken = '';
    async function gasCall(request) {
      let response;
      try {
        response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(request)
        });
      } catch (e) {
        throw new Error('서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.');
      }
      if (!response.ok) throw new Error('서버 응답 오류(' + response.status + ')입니다. 잠시 후 다시 시도해 주세요.');
      try { return await response.json(); }
      catch (e) { throw new Error('서버 응답을 읽을 수 없습니다. 잠시 후 다시 시도해 주세요.'); }
    }
    async function api(path,opts={}) {
      const method=opts.method||'GET';
      let body=opts.body;
      if (typeof body==='string') body=JSON.parse(body);
      const reply=await gasCall({path,method,body:body||{},token:sessionToken});
      if(!reply?.ok) throw new Error(reply?.error||'요청 처리에 실패했습니다.');
      if(path==='/session')sessionToken=reply.data.token;
      return reply.data;
    }
    function readAsBase64(file) {
      return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(String(reader.result).split(',')[1]);
        reader.onerror=()=>reject(new Error('파일을 읽을 수 없습니다.'));
        reader.readAsDataURL(file);
      });
    }
    async function storeLocalFile(file) {
      const limit=5*1024*1024;
      if(file.size>limit)throw new Error('파일은 5MB 이하만 업로드할 수 있습니다. 큰 파일은 별도 전달하세요.');
      return api('/files',{method:'POST',body:{name:file.name,mime:file.type||'application/octet-stream',size:file.size,base64:await readAsBase64(file)}});
    }
    async function fetchFileData(file) {
      if(!file?.id)throw new Error('저장된 파일이 없습니다.');
      return api('/files/'+encodeURIComponent(file.id));
    }
    async function downloadLocalFile(file) {
      try {
        const item=await fetchFileData(file);
        const binary=atob(item.base64);
        const bytes=new Uint8Array(binary.length);
        for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
        const url=URL.createObjectURL(new Blob([bytes],{type:item.mime||'application/octet-stream'}));
        const a=document.createElement('a');a.href=url;a.download=item.name||file.name||'첨부파일';a.click();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
      } catch(e){alert('파일 다운로드 실패: '+e.message);}
    }

    function RenderDraftGraphic({ draft }) {
      const [localUrl, setLocalUrl] = useState('');
      useEffect(()=>{
        setLocalUrl('');
        if(!draft?.storedFile?.id)return;
        let active=true;let objectUrl='';
        fetchFileData(draft.storedFile).then(f=>{
          if(!active)return;
          if(!String(f.mime||'').startsWith('image/'))return;
          const binary=atob(f.base64),bytes=new Uint8Array(binary.length);
          for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
          objectUrl=URL.createObjectURL(new Blob([bytes],{type:f.mime}));setLocalUrl(objectUrl);
        }).catch(()=>setLocalUrl(''));
        return ()=>{active=false;if(objectUrl)URL.revokeObjectURL(objectUrl);};
      },[draft?.storedFile?.id]);
      if (!draft) return null;
      if (localUrl || draft.imageUrl) {
        return (
          <div className="w-full flex items-center justify-center bg-slate-900/5 p-2 rounded-lg">

        // Excel 수식 주입 방지 및 RFC 4180 스타일 이스케이프
        const cell = v => {

      const [posterSides, setPosterSides] = useState('단면');
      const [bannerWidth, setBannerWidth] = useState(300);
      const [bannerHeight, setBannerHeight] = useState(90);
      const [bannerQuantity, setBannerQuantity] = useState(1);
      const [bannerFinish, setBannerFinish] = useState('각목');
      const [webUsage, setWebUsage] = useState('SNS');
      const [etcNotes, setEtcNotes] = useState('');
       const [placardSize,setPlacardSize] = useState('2분할');
       const [placardFinish,setPlacardFinish] = useState('없음');
       const [placardQuantity,setPlacardQuantity] = useState(1);

      // 배송
      const [deliveryMethod, setDeliveryMethod] = useState('택배');
      const [recipientName, setRecipientName] = useState('');
      const [recipientPhone, setRecipientPhone] = useState('');
      const [shippingAddress, setShippingAddress] = useState('서울 중구 퇴계로86가길 5 3층');

      const [showReport, setShowReport] = useState(false);
      const [reportData, setReportData] = useState(null);

      const ITEM_NAMES = {
        BUSINESS_CARD: '명함',
        LEAFLET: '리플릿',
        POSTER: '포스터',
        BANNER: '현수막',
        WEB_BANNER: '웹자보',
        PLACARD: '팻말',
        ETC: '기타'
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const safeDepartment = department.trim().replace(/[\\/:*?"<>|\r\n]/g, '-').replace(/\s+/g, ' ');
        const baseOrderNumber = `${yy}${mm}${dd}-${safeDepartment}`;
        const existingNumbers = new Set((existingOrders || []).map(o => o.orderNumber));
        let ordNum = baseOrderNumber;
        let sequence = 2;
        while (existingNumbers.has(ordNum)) {
          ordNum = `${baseOrderNumber}-${sequence++}`;
        }
        let summary = '';
        let specsObj = {};

        if (itemType === 'BUSINESS_CARD') {
          summary = `표준 90×50mm / ${cardQuantity}매 / 기본지`;
          specsObj = { 수량: `${cardQuantity}매` };
        } else if (itemType === 'LEAFLET') {
          summary = `크기 ${leafletSize} / 수량 ${leafletQuantity}부 / ${leafletColor} / ${leafletSides}`;
          specsObj = { 크기: leafletSize, 수량: `${leafletQuantity}부`, 색상: leafletColor, 인쇄면: leafletSides };
        } else if (itemType === 'POSTER') {
          summary = `크기 ${posterSize} / 수량 ${posterQuantity}장 / ${posterColor} / ${posterSides}`;
          specsObj = { 크기: posterSize, 수량: `${posterQuantity}장`, 색상: posterColor, 인쇄면: posterSides };
        } else if (itemType === 'BANNER') {
          summary = `가로 ${bannerWidth}cm × 세로 ${bannerHeight}cm / ${bannerQuantity}장 / 후가공: ${bannerFinish}`;
          specsObj = { 규격: `${bannerWidth}×${bannerHeight}cm`, 수량: `${bannerQuantity}장`, 후가공: bannerFinish };
        } else if (itemType === 'PLACARD') {

          orderNumber: ordNum,

          itemTypeName: ITEM_NAMES[itemType],
          summarySpecs: summary,

        setReportData(rep);

    // ==========================================
    // 7. [서브 컴포넌트] 디자이너 작업실
    // ==========================================
    function DesignerWorkspaceSubView({
      orders,
      selectedOrder,
      onSelectOrderId,
      onDownloadSpec,
      onDownloadAllOrders,
      onDeleteOrder,
      onOpenChangePwdModal,
      onUpdateOrder,
      triggerToast
    }) {
      const [customFile, setCustomFile] = useState(null);
       const [printFile,setPrintFile]=useState(null);
      const [customPreview, setCustomPreview] = useState('');
      const [designerNote, setDesignerNote] = useState('');

      // 인쇄소 발주 기록 (초기값 비어있음)
      const [handoffDesigner, setHandoffDesigner] = useState('');
      const [handoffShop, setHandoffShop] = useState('');
      const [handoffMethod, setHandoffMethod] = useState('');
      const [handoffDate, setHandoffDate] = useState('');
      const [handoffFileName, setHandoffFileName] = useState('');
      const [handoffMemo, setHandoffMemo] = useState('');

      // 디자이너는 의뢰 전체를 수정할 수 있다. 변경 사항은 저장 버튼을 누르기 전까지 반영되지 않는다.
      const [editOpen, setEditOpen] = useState(false);
      const [editData, setEditData] = useState(null);
      const [extraRequestFiles, setExtraRequestFiles] = useState([]);
      const editOrderField = (key, value) => setEditData(prev => ({...prev, [key]: value}));
      const editSpecField = (key, value) => setEditData(prev => ({...prev, specs: {...(prev.specs||{}), [key]: value}}));
      const makeEditableCopy = (o) => ({...o, specs: {...(o.specs||{})}, rawFiles: [...(o.rawFiles||[])]});
      const ITEM_LABELS = { BUSINESS_CARD:'명함', LEAFLET:'리플릿', POSTER:'포스터', BANNER:'현수막', WEB_BANNER:'웹자보', PLACARD:'팻말', ETC:'기타' };
      const handleSaveOrderEdits = async (e) => {
        e.preventDefault();
        if (!editData) return;
        if (!editData.requesterName.trim() || !editData.contact.trim() || !editData.department.trim() || !editData.dueDate) {
          alert('신청자, 소속, 연락처, 납기일은 반드시 입력해야 합니다.'); return;
        }
        if (editData.deliveryMethod !== '사무실 출력' && editData.itemType !== 'WEB_BANNER' &&
            (!editData.recipientName?.trim() || !editData.recipientPhone?.trim())) {
          alert('수령자 이름과 연락처를 입력해 주세요.'); return;
        }
        let newFiles=[];
        try { newFiles=await Promise.all(extraRequestFiles.map(f=>storeLocalFile(f))); }
        catch(err){ alert('원고 파일 저장 실패: '+err.message); return; }
        const updated={
          ...editData,
          itemTypeName:ITEM_LABELS[editData.itemType]||editData.itemTypeName,
          rawFiles:[...(editData.rawFiles||[]),...newFiles],
          summarySpecs:Object.entries(editData.specs||{}).filter(([k,v])=>String(v).trim()).map(([k,v])=>`${k}: ${v}`).join(' / '),
          adminEditHistory:[...(selectedOrder.adminEditHistory||[]),{at:new Date().toISOString(),message:'디자이너가 발주 및 배송 정보를 수정'}]
        };
        onUpdateOrder(updated);
        setExtraRequestFiles([]);
        setEditOpen(false);
        triggerToast('발주 내용 및 배송·수령 정보를 저장했습니다.');
      };


      useEffect(() => {
        if (selectedOrder?.printHandoff) {
          setHandoffDesigner(selectedOrder.printHandoff.designerName || '');
          setHandoffShop(selectedOrder.printHandoff.printShop || '');
          setHandoffMethod(selectedOrder.printHandoff.method || '');
          setHandoffDate(selectedOrder.printHandoff.expectedDate || '');
          setHandoffFileName(selectedOrder.printHandoff.fileName || '');
          setHandoffMemo(selectedOrder.printHandoff.memo || '');
        } else {
          setHandoffDesigner('');
          setHandoffShop('');
          setHandoffMethod('');
          setHandoffDate('');
          setHandoffFileName('');
          setHandoffMemo('');
        }
      }, [selectedOrder?.id]);
      useEffect(() => {
        if (selectedOrder) setEditData(makeEditableCopy(selectedOrder));
        setEditOpen(false);
        setExtraRequestFiles([]);
      }, [selectedOrder?.id]);

      if (!selectedOrder) return <div className="p-8 text-center bg-white rounded-xl">선택된 의뢰가 없습니다.</div>;

      const nextVer = (selectedOrder.drafts?.length || 0) + 1;

      const handleUpload = async (e) => {
        e.preventDefault();
        if (!customFile) {alert('시안 파일을 먼저 선택해 주세요.');return;}
        let savedFile; try {savedFile=await storeLocalFile(customFile);} catch(err) {alert('시안 저장 실패: '+err.message);return;}
        const newDraft = {
          version: nextVer,
          fileName: savedFile.name,
           storedFile: savedFile,
          imageUrl: '',
          designerNote: designerNote.trim() || `${nextVer}차 시안 작업 완료`,
          uploadedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          uploadedBy: handoffDesigner || '담당 디자이너',
          pins: []
        };
        const updated = {
          ...selectedOrder,
          status: 'REVIEW_REQUESTED',
          drafts: [...(selectedOrder.drafts || []), newDraft]
        };
        onUpdateOrder(updated);
        setCustomFile(null);
        setCustomPreview('');
        setDesignerNote('');

                    <label className="block space-y-1"><span>진행 상태 (관리자 교정)</span><select value={editData.status} onChange={e=>editOrderField('status',e.target.value)} className="w-full border p-2 rounded-lg bg-white">{Object.entries(STATUS_MAP).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select></label>
                    <div className="flex gap-2">
                      <button type="button" onClick={()=>{setEditOpen(false);setEditData(makeEditableCopy(selectedOrder));}} className="flex-1 p-2 rounded-lg bg-slate-200">취소</button>
                      <button type="submit" className="flex-1 p-2 rounded-lg bg-blue-600 text-white font-bold">변경사항 저장</button>
                    </div>
                  </form>
                )}
              </div>
            </div>

            {/* 우측: 시안 등록 & 인쇄소 발주 */}

    // ==========================================
    // 8. [서브 컴포넌트] 시안 검토 & 핀포인트 뷰어
    // ==========================================
    function ClientReviewSubView({ selectedOrder, onDeleteOrder, onSwitchToDesigner, onUpdateOrder, triggerToast }) {
      if (!selectedOrder) return null;
      const drafts = selectedOrder.drafts || [];
      const [selectedVer, setSelectedVer] = useState(drafts.length > 0 ? drafts[drafts.length - 1].version : 1);
      const [isPinMode, setIsPinMode] = useState(false);
      const [feedbackText, setFeedbackText] = useState('');

      useEffect(()=>{setSelectedVer(drafts.length ? drafts[drafts.length-1].version : 1);setIsPinMode(false);},[selectedOrder.id]);
      const curDraft = drafts.find((d) => d.version === selectedVer) || drafts[drafts.length - 1];

      const handleApprove = () => {
        if(!curDraft || curDraft.version !== drafts[drafts.length-1]?.version || !['REVIEW_REQUESTED','REVISION_NEEDED'].includes(selectedOrder.status)){alert('검토할 시안이 없거나 승인 가능한 상태가 아닙니다.');return;}
        if(!window.confirm(`v${curDraft.version} 시안을 최종 승인하시겠습니까?`))return;
        const updated = {
          ...selectedOrder,
          status: 'APPROVED',
          approvedDraftVersion: curDraft.version,
          comments: [...(selectedOrder.comments || []), { id: `c-${Date.now()}`, author: selectedOrder.requesterName, role: 'REQUESTER', content: `[최종 승인] v${curDraft?.version} 시안 확정`, time: '방금 전' }]
        };
        onUpdateOrder(updated);
        triggerToast('최종 시안 승인 완료!');
      };

      const handleRequestRevision = () => {
        if(!curDraft) {alert('수정 요청할 시안이 없습니다.');return;}
        if (!feedbackText.trim()) return;
        const updated = {
          ...selectedOrder,
          status: 'REVISION_NEEDED',
          comments: [...(selectedOrder.comments || []), { id: `c-${Date.now()}`, author: selectedOrder.requesterName, role: 'REQUESTER', content: `[수정 요청] ${feedbackText}`, time: '방금 전' }]
        };
        onUpdateOrder(updated);
        setFeedbackText('');
        triggerToast('수정 요청 전달 완료');
      };

      return (
        <div className="space-y-4 text-xs">
          <div className="bg-white p-5 rounded-2xl border flex justify-between items-center">
            <div>
              <h2 className="text-base font-black text-slate-900">[{selectedOrder.orderNumber}] 의뢰 내역 및 시안 확인</h2>
              <span className="text-slate-400">신청자: {selectedOrder.requesterName} | 상태: {STATUS_MAP[selectedOrder.status]?.label}</span>
            </div>
            <div className="flex gap-2">
              <button onClick={() => onDeleteOrder(selectedOrder.id, selectedOrder.orderNumber)} className="px-3 py-1.5 bg-rose-50 text-rose-600 font-bold rounded-lg">🗑️ 의뢰 삭제</button>
              <button onClick={handleApprove} disabled={!curDraft || curDraft.version !== drafts[drafts.length-1]?.version || !['REVIEW_REQUESTED','REVISION_NEEDED'].includes(selectedOrder.status)} className="px-3 py-1.5 bg-emerald-600 text-white font-bold rounded-lg">✓ 최종 시안 승인</button>
              <button onClick={onSwitchToDesigner} className="px-3 py-1.5 bg-slate-900 text-white font-bold rounded-lg">🎨 디자이너 모드</button>
            </div>
          </div>

          {/* 의뢰 내용은 시안 등록 여부와 관계없이 항상 보여줍니다. */}
          <section className="bg-white p-5 rounded-2xl border border-slate-200 space-y-4">
            <div className="flex items-center justify-between border-b pb-3">
              <h3 className="text-sm font-black text-slate-900">📋 주문 내역</h3>
              <span className="text-[11px] px-2 py-1 rounded-lg bg-slate-100 text-slate-600">{selectedOrder.itemTypeName || selectedOrder.itemType || '기타'}</span>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {[
                ['접수번호', selectedOrder.orderNumber],
                ['단체명', selectedOrder.department],
                ['신청자', selectedOrder.requesterName],
                ['연락처', selectedOrder.contact],
                ['완료 희망일', selectedOrder.dueDate],
                ['진행 상태', STATUS_MAP[selectedOrder.status]?.label || selectedOrder.status]
              ].map(([label, value]) => (
                <div key={label} className="bg-slate-50 rounded-xl p-3 min-w-0">
                  <div className="text-slate-500 mb-1">{label}</div>
                  <div className="font-bold text-slate-800 break-words">{value || '미입력'}</div>
                </div>
              ))}
            </div>
            <div className="border rounded-xl p-4 space-y-2">
              <h4 className="font-bold text-slate-800">제작 사양</h4>
              <p className="whitespace-pre-wrap break-words text-slate-700">{selectedOrder.summarySpecs || '미입력'}</p>
              {selectedOrder.specs && Object.keys(selectedOrder.specs).length > 0 && (
                <dl className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2 border-t">
                  {Object.entries(selectedOrder.specs).map(([key, value]) => (
                    <div key={key} className="flex gap-2 min-w-0"><dt className="font-bold text-slate-600 shrink-0">{key}</dt><dd className="break-words">{Array.isArray(value) ? value.join(', ') : String(value ?? '')}</dd></div>
                  ))}
                </dl>
              )}
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div className="border rounded-xl p-4 space-y-2">
                <h4 className="font-bold">디자인 요청사항</h4>
                <p className="whitespace-pre-wrap break-words">{selectedOrder.requestNotes || '없음'}</p>
              </div>
              <div className="border rounded-xl p-4 space-y-2">
                <h4 className="font-bold">원고 내용</h4>
                <p className="whitespace-pre-wrap break-words">{selectedOrder.contentNotes || '없음'}</p>
              </div>
            </div>
            <div className="border rounded-xl p-4 space-y-2">
              <h4 className="font-bold">원고·참고자료 첨부</h4>
              {selectedOrder.rawFiles?.length ? <FileLinks files={selectedOrder.rawFiles} /> : <p className="text-slate-500">첨부파일 없음</p>}
            </div>
            {selectedOrder.itemType !== 'WEB_BANNER' && (
              <div className="border rounded-xl p-4 space-y-2">
                <h4 className="font-bold">배송 및 수령 정보</h4>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <p>수령 방법: {selectedOrder.deliveryMethod || '미입력'}</p>
                  <p>수령자: {selectedOrder.recipientName || '미입력'}</p>
                  <p>연락처: {selectedOrder.recipientPhone || '미입력'}</p>
                  <p className="break-words">주소: {selectedOrder.shippingAddress || '미입력'}</p>
                </div>
              </div>
            )}
          </section>

          <h3 className="text-sm font-black text-slate-900 px-1">🖼️ 시안 및 수정 의견</h3>
          {drafts.length === 0 ? (
            <div className="p-12 text-center bg-white rounded-2xl border text-slate-400 font-bold">
              아직 등록된 시안이 없습니다. 위에서 주문 내역을 확인할 수 있습니다.
            </div>
          ) : (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className="lg:col-span-8 bg-white p-5 rounded-2xl border space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <div className="flex gap-1">
                    {drafts.map((d) => (
                      <button
                        key={d.version}
                        onClick={() => setSelectedVer(d.version)}
                        className={`px-3 py-1 rounded-lg font-bold ${selectedVer === d.version ? 'bg-purple-600 text-white' : 'bg-slate-100 text-slate-700'}`}
                      >
                        v{d.version}
                      </button>
                    ))}
                  </div>
                  <button onClick={() => setIsPinMode(!isPinMode)} className={`px-3 py-1 rounded-lg font-bold ${isPinMode ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-700'}`}>
                    📍 {isPinMode ? '핀 모드 종료' : '시안 위에 핀 찍기'}
                  </button>
                </div>

                {/* 핀포인트 캔버스 */}
                <>
                {curDraft?.storedFile && <FileLinks files={[curDraft.storedFile]} />}
                <PinpointCanvasWidget
                  draft={curDraft}
                  isPinMode={isPinMode}
                  onSavePins={(pins) => {
                    const newDrafts = drafts.map((d) => d.version === curDraft.version ? { ...d, pins } : d);
                    onUpdateOrder({ ...selectedOrder, drafts: newDrafts });
                  }}
                /></>
              </div>

              {/* 우측 피드백 작성 */}
              <div className="lg:col-span-4 bg-white p-5 rounded-2xl border space-y-4">
                <h3 className="font-bold text-sm text-slate-900">수정 요청 피드백</h3>
                <textarea rows="4" placeholder="수정 사항을 입력하세요" value={feedbackText} onChange={(e) => setFeedbackText(e.target.value)} className="w-full border p-2.5 rounded-xl bg-slate-50 resize-none" />
                <button onClick={handleRequestRevision} className="w-full py-2 bg-rose-600 text-white font-bold rounded-xl">수정 요청 전달</button>
                <div className="border-t pt-2 space-y-2 max-h-60 overflow-y-auto">
                  <span className="font-bold text-slate-500 block">피드백 기록:</span>
                  {(selectedOrder.comments || []).map((c) => (
                    <div key={c.id} className="p-2 rounded bg-slate-50 border text-[11px]">
                      <strong>{c.author}:</strong> {c.content}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 9. [서브 컴포넌트] 핀포인트 캔버스 위젯
    // ==========================================
    function PinpointCanvasWidget({ draft, isPinMode, onSavePins }) {
      const containerRef = useRef(null);
      const [pins, setPins] = useState(draft?.pins || []);

      useEffect(() => {
        setPins(draft?.pins || []);
      }, [draft?.pins, draft?.version]);

      const handleCanvasClick = (e) => {
        if (!isPinMode || !containerRef.current) return;
        const rect = containerRef.current.getBoundingClientRect();
        const xPercent = Math.round(((e.clientX - rect.left) / rect.width) * 100);
        const yPercent = Math.round(((e.clientY - rect.top) / rect.height) * 100);
        const memo = prompt('이 위치의 수정 메모를 입력하세요:');
        if (!memo || !memo.trim()) return;

        const newPin = {
          id: `pin-${Date.now()}`,
          xPercent,
          yPercent,
          comment: memo.trim(),
          createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        const updated = [...pins, newPin];
        setPins(updated);
        onSavePins(updated);
      };

      return (
        <div ref={containerRef} onClick={handleCanvasClick} className={`relative rounded-xl border overflow-hidden select-none ${isPinMode ? 'cursor-crosshair ring-2 ring-rose-500' : ''}`}>
          <RenderDraftGraphic draft={draft} />
          {pins.map((p, idx) => (
            <div
              key={p.id}
              style={{ left: `${p.xPercent}%`, top: `${p.yPercent}%` }}
              className="absolute -translate-x-1/2 -translate-y-1/2 group"
            >
              <div className="w-6 h-6 rounded-full bg-rose-600 text-white font-bold flex items-center justify-center text-[11px] shadow-md">
                {idx + 1}
              </div>
              <div className="hidden group-hover:block absolute left-7 top-0 w-48 bg-slate-900 text-white p-2 rounded text-[11px] z-30 shadow-lg">
                {p.comment}
              </div>
            </div>
          ))}
        </div>
      );
    }

    // DOM 렌더링
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
